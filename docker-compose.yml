services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mosi
      POSTGRES_PASSWORD: mosi
      POSTGRES_DB: mosi
    volumes:
      - mosi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosi -d mosi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mosi_pg_data:
